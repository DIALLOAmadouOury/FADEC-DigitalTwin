name: Compilation STM32

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Récupérer le code
      uses: actions/checkout@v4

    - name: ⚙️ Installer la Toolchain ARM
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '12.2.Rel1'

    - name: 🚀 Lancer la compilation
      # Avec le format Makefile de CubeMX, on compile directement à la racine
      # -j$(nproc) permet d'utiliser tous les coeurs du serveur GitHub pour compiler plus vite
      run: make -j$(nproc)